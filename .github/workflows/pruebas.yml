name: pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entregable3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: entregable3/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest==8.4.2
      - name: Ejecutar pruebas
        run: pytest
